baseurl = "https://yzlnew.com/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
theme = "ink"
pagination.pagerSize = 8

copyright = "© Copyright Ye Zhiling"
# googleAnalytics = "UA-61197619-1"

summaryLength = 20

[params]
    featherIconsCDN = true
    mode = "auto"
    customCSS = "css/custom.css"
    customDarkCSS = "css/custom_dark.css"
    avatar = "img/avatar.png"
    favicon = "img/favicon.png"
    startYear = 2016

    i18n_flags = true

[params.utter]
enable = true
repo = "yzlnew/yzlnew.github.io"
issueTerm = "title"
theme = "github-light"

[[params.social]]
name = "Mail"
icon = "mail"
url = "mailto:yzlnew@gmail.com"

[[params.social]]
name = "Github"
icon = "github"
url = "https://github.com/yzlnew"

[[params.social]]
name = "Telegram"
icon = "message-square"
url = "https://t.me/r0brew"

[[params.social]]
name = "RSS"
icon = "rss"
url = "/index.xml"

[languages]
  [languages.zh-cn]
    languageCode = "zh-cn"
    languageName = "中文"
    title = "黄石的时空回环"
    weight = 1
    [languages.zh-cn.params]
      subtitle = "Let me fly to the 🌕️"
      lang = "cn"
    [[languages.zh-cn.menu.main]]
      name = "主页"
      url = "/"
      weight = 1
    [[languages.zh-cn.menu.main]]
      name = "关于我"
      url = "/about"
      weight = 2
    [[languages.zh-cn.menu.main]]
      name = "标签"
      url = "/tags"
      weight = 3

  [languages.en]
    languageCode = "en"
    languageName = "English"
    title = "Time Loop of Huangshi"
    weight = 2
    [languages.en.params]
      subtitle = "Let me fly to the 🌕️"
      lang = "en"
    [[languages.en.menu.main]]
      name = "Home"
      url = "/en/"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "/en/about/"
      weight = 2
    [[languages.en.menu.main]]
      name = "Tags"
      url = "/en/tags/"
      weight = 3

[taxonomies]
   tag = "tags"


author = "@yzlnew"
builddrafts = false
canonifyurls = true
contentdir = "content"
layoutdir = "layouts"
publishdir = "public"

[permalinks]
blog = "/:year/:month/:slug"

[markup]
  [markup.tableOfContents]
    endLevel = 4
    startLevel = 3
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = "pastie"
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = true

[services]
  [services.rss]
    limit = 20
