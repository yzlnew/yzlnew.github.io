{{ $height := .height | string }}{{ if ne .kind "mermaid" }}{{ if not (findRE `^[1-9][0-9]{1,3}$` $height) }}{{ errorf "Chart height must be a number of pixels (10–9999): %s" $height }}{{ end }}{{ end }}<figure class="chart-block" data-chart="{{ .kind }}" data-error="{{ i18n "chartError" }}"><figcaption><strong>{{ .title }}</strong><span class="chart-description">{{ .description }}</span></figcaption><div class="chart-canvas" role="img" aria-label="{{ .title }}. {{ .description }}" {{ if ne .kind "mermaid" }}style="{{ printf "height:%spx" $height | safeCSS }}"{{ end }}></div><p class="chart-status" role="status">{{ i18n "chartPending" }}</p><details class="chart-source" open><summary>{{ i18n "source" }}</summary><pre tabindex="0"><code>{{ .source }}</code></pre></details></figure>
