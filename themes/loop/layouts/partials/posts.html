<div class="post-list">{{ range . }}<article class="post-card"><div class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time></div><div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p class="summary">{{ with .Description }}{{ . }}{{ else }}{{ partial "plain-content.html" .Summary }}{{ end }}</p>{{ partial "tags.html" . }}</div><span class="post-arrow" aria-hidden="true">↗</span></article>{{ end }}</div>
